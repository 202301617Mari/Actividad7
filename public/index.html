<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sincrolitos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="login-container" id="loginContainer">
    <div class="login-box">
      <h2>Sincrolitos Chat</h2>
      <p>¿Cómo te llamas? <span style="color:#64748b;font-size:0.85rem;">(opcional)</span></p>
      <input type="text" id="nameInput" placeholder="Ingrese su nombre o deje vacío..." maxlength="20">
      <span id="errorMsg" class="error-msg"></span>
      <button id="enterBtn">Entrar al chat</button>
    </div>
  </div>

  <div class="chat-container" id="chatContainer" style="display:none;">
    <div class="chat-header">
      <h1>Sincrolitos 💬</h1>
      <span id="connectionStatus" class="status-dot disconnected">🔴 Desconectado</span>
    </div>

    <div id="messages"></div>

    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Escribe un mensaje...">
      <button id="sendBtn">Enviar</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
